<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拾光相册 / Lumina</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>拾光相册 / Lumina</h1>
    </div>
    <div class="folder-row">
      <input id="folderInput" type="text" placeholder="选择存放回忆的文件夹，例如 D:\Photos" />
      <button id="browseBtn" class="btn" title="浏览文件夹"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></button>
      <button id="openFolderBtn" class="btn" title="在文件管理器中打开"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><path d="M6 15h12l2-5H4z"/></svg></button>
      <button id="historyBtn" class="btn" title="整理过的文件夹"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
      <button id="scanBtn" class="btn primary">开始整理</button>
      <button id="rebuildIndexBtn" class="btn" title="同步相册">同步相册</button>
      <label class="force-label"><input type="checkbox" id="forceScan" /> 重新整理全部</label>
      <button id="settingsBtn" class="btn" title="设置"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></button>
    </div>
    <div id="folderHistory" class="folder-history hidden"></div>
    <div id="scanProgress" class="scan-progress hidden">
      <div class="progress-text" id="progressText">准备中…</div>
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      <button id="cancelScanBtn" class="btn small">取消</button>
    </div>
  </header>

  <section class="stats" id="statsBar">
    <div class="stat clickable-stat" data-filter="all"><span class="stat-num" id="statTotal">0</span><span class="stat-label">全部回忆</span></div>
    <div class="stat clickable-stat" data-filter="analyzed"><span class="stat-num" id="statAnalyzed">0</span><span class="stat-label">已收录</span></div>
    <div class="stat clickable-stat" data-filter="favorite"><span class="stat-num" id="statFavorite">0</span><span class="stat-label">已珍藏</span></div>
    <div class="stat clickable-stat" data-filter="pending"><span class="stat-num" id="statPending">0</span><span class="stat-label">待整理</span></div>
    <div class="stat clickable-stat" data-filter="deleted"><span class="stat-num" id="statDeleted">0</span><span class="stat-label">已收起</span></div>
    <div class="stats-actions hidden" id="trashActions">
      <button id="emptyTrashBtn" class="btn danger">清空回收站</button>
    </div>
  </section>

  <section class="filters">
    <div class="filter-group" data-filter-key="min_score">
      <label>最低回忆分</label>
      <select id="minScoreFilter">
        <option value="">不限</option>
        <option value="0">0</option>
        <option value="3">3</option>
        <option value="5">5</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </select>
    </div>
    <div class="filter-group sort-group" data-filter-key="sort">
      <label>排序</label>
      <select id="sortFilter">
        <option value="score_desc" selected>总分从高到低</option>
        <option value="score_asc">总分从低到高</option>
        <option value="time_desc">拍摄时间从晚到早</option>
        <option value="time_asc">拍摄时间从早到晚</option>
        <option value="filename">按文件名</option>
        <option value="recent">按分析时间</option>
        <option value="size">按文件大小</option>
      </select>
    </div>
    <div class="filter-group tag-group" data-filter-key="tag">
      <label>标签</label>
      <select id="tagFilter">
        <option value="">全部标签</option>
      </select>
    </div>
    <div class="filter-group" data-filter-key="year">
      <label>拍摄年份</label>
      <select id="yearFilter">
        <option value="">全部年份</option>
      </select>
    </div>
    <div class="filter-group" data-filter-key="search_mode">
      <label>搜索方式</label>
      <select id="searchMode">
        <option value="smart">智能搜索</option>
        <option value="keyword">关键词</option>
        <option value="semantic">语义</option>
      </select>
    </div>
    <div class="filter-group grow" data-filter-key="search">
      <input id="searchInput" type="search" placeholder="想找哪段回忆？" />
    </div>
    <button id="searchBtn" class="btn" title="搜索"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
    <button id="resetFiltersBtn" class="btn" title="重置筛选">重置筛选</button>
  </section>

  <div class="hidden">
    <select id="statusFilter" data-no-custom>
      <option value="all">全部回忆</option>
      <option value="analyzed" selected>已收录</option>
      <option value="favorite">已珍藏</option>
      <option value="pending">待整理</option>
      <option value="deleted">已收起</option>
    </select>
    <select id="favoriteFilter" data-no-custom>
      <option value="">全部</option>
      <option value="1">已珍藏</option>
    </select>
  </div>

  <main id="gallery" class="gallery"></main>
  <div id="emptyState" class="empty-state hidden">
    <p>还没有照片。<br>选择一份装满回忆的文件夹，开始温柔收录吧。</p>
  </div>

  <div id="selectionBar" class="selection-bar hidden">
    <span>已选 <strong id="selectedCount">0</strong> 张</span>
    <button id="deleteSelectedBtn" class="btn danger" title="暂时收起"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
    <button id="restoreSelectedBtn" class="btn" title="恢复"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
    <button id="reanalyzeSelectedBtn" class="btn" title="重新解读选中照片"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
    <button id="permanentDeleteSelectedBtn" class="btn danger" title="彻底移除"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <button id="clearSelectionBtn" class="btn" title="取消选择"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>

  <!-- Preview modal -->
  <div id="previewModal" class="modal hidden">
    <button id="previewPrevBtn" class="preview-side-btn prev" title="上一张"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <button id="previewNextBtn" class="preview-side-btn next" title="下一张"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    <div class="modal-content preview-content">
      <button class="modal-close" data-close="previewModal"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      <div class="preview-body">
        <img id="previewImage" alt="预览" />
        <div id="previewInfo" class="preview-info"></div>
      </div>
      <div class="preview-actions">
        <button id="previewDeleteBtn" class="btn danger" title="暂时收起"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
        <button id="previewRestoreBtn" class="btn" title="恢复"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
        <button id="previewPermanentDeleteBtn" class="btn danger" title="彻底移除"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        <button id="previewEditBtn" class="btn" title="编辑回忆信息"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
        <button id="previewReanalyzeBtn" class="btn" title="重新解读"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
        <button id="previewFavoriteBtn" class="btn" title="珍藏"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
      </div>
    </div>
  </div>

  <!-- Folder browser modal -->
  <div id="dirModal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" data-close="previewModal"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      <h2>选择回忆文件夹</h2>
      <div class="dir-row">
        <input id="dirPathInput" type="text" placeholder="当前路径" />
        <button id="dirGoBtn" class="btn">前往</button>
        <button id="dirUpBtn" class="btn">上级</button>
      </div>
      <ul id="dirList" class="dir-list"></ul>
      <div class="dir-actions">
        <button id="dirChooseBtn" class="btn primary" disabled>选择此文件夹</button>
      </div>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" data-close="settingsModal"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      <h2>拾光设置 · 模型与回忆服务</h2>
      <div class="form-grid">
        <label>API Base URL
          <input id="setApiBase" type="text" placeholder="http://localhost:1234/v1" />
        </label>
        <label>API Key
          <input id="setApiKey" type="password" placeholder="not-needed" />
        </label>
        <label>模型名称
          <input id="setModel" type="text" placeholder="local-model" />
        </label>
        <label class="full-row">自定义系统提示词
          <textarea id="setSystemPrompt" rows="6" placeholder="留空使用内置提示词，或点击下方按钮填入模板"></textarea>
          <div class="prompt-template-row">
            <button type="button" id="usePromptTemplateBtn" class="btn small">填入内置模板</button>
            <button type="button" id="clearPromptBtn" class="btn small">清空（使用默认）</button>
          </div>
        </label>
        <label>代理图片最大边长
          <input id="setMaxEdge" type="number" min="64" step="64" />
        </label>
        <label>请求超时（秒）
          <input id="setTimeout" type="number" min="5" />
        </label>
        <label>索引线程数
          <input id="setIndexThreads" type="number" min="1" max="32" step="1" />
        </label>
        <label>地理编码服务
          <select id="setGeocodingProvider">
            <option value="nominatim">Nominatim（免费，无需 Key）</option>
            <option value="amap">高德地图</option>
          </select>
        </label>
        <label>地理编码 API Key
          <input id="setGeocodingApiKey" type="password" placeholder="高德 Key（可选）" />
        </label>
        <label>地理编码请求间隔（秒）
          <input id="setGeocodingInterval" type="number" min="0.1" max="10" step="0.1" />
        </label>
        <label>地理编码请求重试次数
          <input id="setGeocodingRetries" type="number" min="0" max="10" step="1" />
        </label>
      </div>
      <div class="modal-actions">
        <button id="removeFolderBtn" class="btn danger remove-folder-btn">移除当前目录</button>
        <button id="cleanCacheBtn" class="btn">清理缓存</button>
        <button id="saveSettingsBtn" class="btn primary">保存</button>
      </div>
    </div>
  </div>

  <!-- Edit app-generated metadata modal -->
  <div id="editModal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" data-close="editModal"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      <h2>编辑这段回忆</h2>
      <div class="form-grid edit-grid">
        <label class="full-row">照片标题
          <input id="editTitle" type="text" maxlength="40" placeholder="为空时显示文件名" />
        </label>
        <label>总分
          <input id="editScore" type="number" min="0" max="10" step="0.1" />
        </label>
        <label>技术
          <input id="editTechnical" type="number" min="0" max="10" step="0.1" />
        </label>
        <label>构图
          <input id="editComposition" type="number" min="0" max="10" step="0.1" />
        </label>
        <label>回忆
          <input id="editMemory" type="number" min="0" max="10" step="0.1" />
        </label>
        <label>独特
          <input id="editUniqueness" type="number" min="0" max="10" step="0.1" />
        </label>
        <label>地点
          <input id="editLocation" type="text" placeholder="例如：杭州，西湖边" />
        </label>
        <label class="full-row">标签
          <input id="editTags" type="text" placeholder="用逗号分隔，例如：风景，旅行，黄昏" />
        </label>
        <label class="full-row">简评
          <textarea id="editReason" rows="3" placeholder="为这段回忆写一句温柔的话"></textarea>
        </label>
      </div>
      <div class="modal-actions">
        <button id="editCancelBtn" class="btn">取消</button>
        <button id="editSaveBtn" class="btn primary">保存</button>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Loading modal -->
  <div id="loadingModal" class="modal hidden">
    <div class="modal-content loading-content">
      <div class="spinner"></div>
      <p id="loadingText">正在用大模型寻找相关回忆…</p>
    </div>
  </div>

  <!-- Custom confirm dialog -->
  <div id="confirmModal" class="modal hidden">
    <div class="modal-content confirm-content">
      <button class="modal-close" data-close="confirmModal"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      <h2 id="confirmTitle">确认操作</h2>
      <p id="confirmMessage"></p>
      <div class="modal-actions">
        <button id="confirmCancelBtn" class="btn">取消</button>
        <button id="confirmOkBtn" class="btn primary danger">确定</button>
      </div>
    </div>
  </div>

  <script src="/static/js/icons.js"></script>
  <script src="/static/js/ui-kit.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
