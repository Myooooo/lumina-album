<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拾光相册 / Lumina Album</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>拾光相册 <span class="sub">Lumina</span></h1>
    </div>
    <div class="folder-row">
      <div class="folder-input-wrapper">
        <span class="input-icon" id="folderInputIcon"></span>
        <input id="folderInput" type="text" placeholder="选择存放回忆的文件夹，例如 D:\Photos" />
      </div>
      <button id="browseBtn" class="btn" title="浏览文件夹"><span class="btn-icon" data-icon="folder"></span>浏览</button>
      <button id="openFolderBtn" class="btn icon-only" title="在文件管理器中打开"><span class="btn-icon" data-icon="folderOpen"></span></button>
      <button id="historyBtn" class="btn icon-only" title="整理过的文件夹"><span class="btn-icon" data-icon="history"></span></button>
      <button id="scanBtn" class="btn primary"><span class="btn-icon" data-icon="sparkles"></span>开始整理</button>
      <button id="rebuildIndexBtn" class="btn" title="同步相册"><span class="btn-icon" data-icon="sync"></span>同步相册</button>
      <label class="force-label"><input type="checkbox" id="forceScan" /> 重新整理全部</label>
      <button id="settingsBtn" class="btn icon-only" title="设置"><span class="btn-icon" data-icon="settings"></span></button>
    </div>
    <div id="folderHistory" class="folder-history hidden"></div>
    <div id="scanProgress" class="scan-progress hidden">
      <div class="progress-text" id="progressText">准备中…</div>
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      <button id="cancelScanBtn" class="btn small"><span class="btn-icon" data-icon="close"></span>取消</button>
    </div>
  </header>

  <section class="stats" id="statsBar">
    <div class="stat clickable-stat" data-filter="all">
      <span class="stat-icon" data-icon="collection"></span>
      <span class="stat-label">全部回忆</span>
      <span class="stat-num" id="statTotal">0</span>
    </div>
    <div class="stat clickable-stat" data-filter="analyzed">
      <span class="stat-icon" data-icon="sparkles"></span>
      <span class="stat-label">已收录</span>
      <span class="stat-num" id="statAnalyzed">0</span>
    </div>
    <div class="stat clickable-stat" data-filter="favorite">
      <span class="stat-icon" data-icon="heart"></span>
      <span class="stat-label">已珍藏</span>
      <span class="stat-num" id="statFavorite">0</span>
    </div>
    <div class="stat clickable-stat" data-filter="pending">
      <span class="stat-icon" data-icon="hourglass"></span>
      <span class="stat-label">待整理</span>
      <span class="stat-num" id="statPending">0</span>
    </div>
    <div class="stat clickable-stat" data-filter="deleted">
      <span class="stat-icon" data-icon="archive"></span>
      <span class="stat-label">已收起</span>
      <span class="stat-num" id="statDeleted">0</span>
    </div>
    <div class="stats-actions hidden" id="trashActions">
      <button id="emptyTrashBtn" class="btn danger"><span class="btn-icon" data-icon="trash"></span>清空回收站</button>
    </div>
  </section>

  <section class="filters">
    <div class="filter-group" data-filter-key="min_score">
      <label><span class="label-icon" data-icon="score"></span>总分</label>
      <select id="minScoreFilter">
        <option value="">不限</option>
        <option value="2">2分</option>
        <option value="4">4分</option>
        <option value="6">6分</option>
        <option value="8">8分</option>
      </select>
    </div>
    <div class="filter-group sort-group" data-filter-key="sort">
      <label><span class="label-icon" data-icon="dimensions"></span>排序方式</label>
      <select id="sortFilter">
        <option value="score_desc" selected>总分从高到低</option>
        <option value="score_asc">总分从低到高</option>
        <option value="time_desc">拍摄时间从晚到早</option>
        <option value="time_asc">拍摄时间从早到晚</option>
        <option value="filename">按文件名</option>
        <option value="recent">按分析时间</option>
        <option value="size">按文件大小</option>
      </select>
    </div>
    <div class="filter-group tag-group" data-filter-key="tag">
      <label><span class="label-icon" data-icon="tag"></span>回忆标签</label>
      <select id="tagFilter">
        <option value="">全部标签</option>
      </select>
    </div>
    <div class="filter-group" data-filter-key="year">
      <label><span class="label-icon" data-icon="calendar"></span>拍摄年份</label>
      <select id="yearFilter">
        <option value="">全部年份</option>
      </select>
    </div>
    <div class="filter-group" data-filter-key="search_mode">
      <label><span class="label-icon" data-icon="scan"></span>搜索方式</label>
      <select id="searchMode">
        <option value="smart">智能语义搜索</option>
        <option value="keyword">关键词匹配</option>
        <option value="semantic">大模型语义</option>
      </select>
    </div>
    <div class="filter-group grow" data-filter-key="search">
      <label><span class="label-icon" data-icon="search"></span>探索回忆</label>
      <input id="searchInput" type="search" placeholder="例如：去年秋天的金黄落叶、西湖落日…" />
    </div>
    <button id="searchBtn" class="btn" title="搜索"><span class="btn-icon" data-icon="search"></span>搜索</button>
    <button id="resetFiltersBtn" class="btn" title="重置筛选"><span class="btn-icon" data-icon="reset"></span>重置</button>
  </section>

  <div class="hidden">
    <select id="statusFilter" data-no-custom>
      <option value="all">全部回忆</option>
      <option value="analyzed" selected>已收录</option>
      <option value="favorite">已珍藏</option>
      <option value="pending">待整理</option>
      <option value="deleted">已收起</option>
    </select>
    <select id="favoriteFilter" data-no-custom>
      <option value="">全部</option>
      <option value="1">已珍藏</option>
    </select>
  </div>

  <main id="gallery" class="gallery"></main>
  <div class="gallery-load-more-wrap">
    <button id="loadMoreBtn" class="btn gallery-load-more hidden"><span class="btn-icon" data-icon="chevronDown"></span>加载更多回忆</button>
  </div>
  <div id="emptyState" class="empty-state hidden">
    <span class="empty-icon" data-icon="sparkles"></span>
    <p>还没有照片。<br>选择一份装满回忆的文件夹，开启温暖的时光旅程吧。</p>
  </div>

  <div id="selectionBar" class="selection-bar hidden">
    <span>已选择 <strong id="selectedCount">0</strong> 张回忆</span>
    <button id="deleteSelectedBtn" class="btn danger" title="暂时收起"><span class="btn-icon" data-icon="trash"></span>暂时收起</button>
    <button id="restoreSelectedBtn" class="btn" title="恢复"><span class="btn-icon" data-icon="restore"></span>恢复</button>
    <button id="reanalyzeSelectedBtn" class="btn" title="重新解读"><span class="btn-icon" data-icon="refresh"></span>重新解读</button>
    <button id="permanentDeleteSelectedBtn" class="btn danger" title="彻底移除"><span class="btn-icon" data-icon="close"></span>彻底移除</button>
    <button id="clearSelectionBtn" class="btn" title="取消选择"><span class="btn-icon" data-icon="close"></span>取消</button>
  </div>

  <!-- Immersive Lightbox Preview modal -->
  <div id="previewModal" class="modal hidden">
    <button id="previewPrevBtn" class="preview-side-btn prev" title="上一张 (←)"><span class="btn-icon" data-icon="chevronLeft"></span></button>
    <button id="previewNextBtn" class="preview-side-btn next" title="下一张 (→)"><span class="btn-icon" data-icon="chevronRight"></span></button>
    <div class="modal-content preview-content">
      <button class="modal-close" data-close="previewModal" title="关闭 (Esc)"><span class="btn-icon" data-icon="close"></span></button>
      <div class="preview-body">
        <div class="preview-media-col">
          <img id="previewImage" alt="预览" />
        </div>
        <div id="previewInfo" class="preview-info"></div>
      </div>
      <div class="preview-actions">
        <button id="previewDeleteBtn" class="btn danger" title="暂时收起"><span class="btn-icon" data-icon="trash"></span>暂时收起</button>
        <button id="previewRestoreBtn" class="btn" title="恢复"><span class="btn-icon" data-icon="restore"></span>恢复</button>
        <button id="previewPermanentDeleteBtn" class="btn danger" title="彻底移除"><span class="btn-icon" data-icon="close"></span>彻底移除</button>
        <button id="previewEditBtn" class="btn" title="编辑回忆信息"><span class="btn-icon" data-icon="edit"></span>编辑回忆</button>
        <button id="previewReanalyzeBtn" class="btn" title="重新解读"><span class="btn-icon" data-icon="refresh"></span>重新解读</button>
        <button id="previewFavoriteBtn" class="btn" title="珍藏"><span class="btn-icon" data-icon="heart"></span><span>珍藏</span></button>
      </div>
    </div>
  </div>

  <!-- Folder browser modal -->
  <div id="dirModal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" data-close="dirModal"><span class="btn-icon" data-icon="close"></span></button>
      <h2><span class="modal-title-icon" data-icon="folder"></span>选择回忆文件夹</h2>
      <div class="dir-row">
        <input id="dirPathInput" type="text" placeholder="当前路径" />
        <button id="dirGoBtn" class="btn"><span class="btn-icon" data-icon="arrowRight"></span>前往</button>
      </div>
      <ul id="dirList" class="dir-list"></ul>
      <div class="dir-actions">
        <button id="dirChooseBtn" class="btn primary" disabled><span class="btn-icon" data-icon="check"></span>选择此文件夹</button>
      </div>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" data-close="settingsModal"><span class="btn-icon" data-icon="close"></span></button>
      <h2><span class="modal-title-icon" data-icon="settings"></span>拾光设置 · 模型与回忆服务</h2>
      <div class="form-grid">
        <label>API Base URL
          <input id="setApiBase" type="text" placeholder="http://localhost:1234/v1 或 Ollama 地址" />
        </label>
        <label>API Key
          <input id="setApiKey" type="password" placeholder="not-needed" />
        </label>
        <label>多模态模型名称
          <input id="setModel" type="text" placeholder="例如：llava, qwen-vl, local-model" />
        </label>
        <label class="full-row">自定义系统提示词
          <textarea id="setSystemPrompt" rows="5" placeholder="留空使用内置提示词，或点击下方按钮填入模板"></textarea>
          <div class="prompt-template-row" id="promptPresetRow">
            <button type="button" class="btn small preset-btn" data-preset="playful"><span class="btn-icon" data-icon="sparkles"></span>活泼（默认）</button>
            <button type="button" class="btn small preset-btn" data-preset="literary"><span class="btn-icon" data-icon="feather"></span>文艺</button>
            <button type="button" class="btn small preset-btn" data-preset="melancholy"><span class="btn-icon" data-icon="cloudRain"></span>伤感</button>
            <button type="button" class="btn small preset-btn" data-preset="humorous"><span class="btn-icon" data-icon="smile"></span>幽默</button>
          </div>
        </label>
        <label>代理图片最大边长 (px)
          <input id="setMaxEdge" type="number" min="64" step="64" />
        </label>
        <label>画廊缩略图边长 (px)
          <input id="setGalleryThumbSize" type="number" min="96" max="1024" step="32" />
        </label>
        <label>模型并发请求数
          <input id="setModelConcurrency" type="number" min="1" max="16" step="1" />
        </label>
        <label>模型请求重试次数
          <input id="setModelRetries" type="number" min="0" max="10" step="1" />
        </label>
        <label>请求超时（秒）
          <input id="setTimeout" type="number" min="5" />
        </label>
        <label>索引线程数
          <input id="setIndexThreads" type="number" min="1" max="32" step="1" />
        </label>
        <label>地理编码服务
          <select id="setGeocodingProvider">
            <option value="nominatim">Nominatim（免费，无需 Key）</option>
            <option value="amap">高德地图 API</option>
          </select>
        </label>
        <label>地理编码 API Key
          <input id="setGeocodingApiKey" type="password" placeholder="高德 Key（可选）" />
        </label>
        <label>地理编码请求间隔（秒）
          <input id="setGeocodingInterval" type="number" min="0.1" max="10" step="0.1" />
        </label>
        <label>地理编码请求重试次数
          <input id="setGeocodingRetries" type="number" min="0" max="10" step="1" />
        </label>
      </div>
      <div class="modal-actions">
        <button id="removeFolderBtn" class="btn danger remove-folder-btn"><span class="btn-icon" data-icon="trash"></span>移除当前目录</button>
        <button id="cleanCacheBtn" class="btn"><span class="btn-icon" data-icon="clean"></span>清理缓存</button>
        <button id="saveSettingsBtn" class="btn primary"><span class="btn-icon" data-icon="check"></span>保存设置</button>
      </div>
    </div>
  </div>

  <!-- Edit app-generated metadata modal -->
  <div id="editModal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" data-close="editModal"><span class="btn-icon" data-icon="close"></span></button>
      <h2><span class="modal-title-icon" data-icon="edit"></span>编辑这段回忆</h2>
      <div class="form-grid edit-grid">
        <label class="full-row">照片标题
          <input id="editTitle" type="text" maxlength="40" placeholder="为空时显示文件名" />
        </label>
        <label>总评分 (0-10)
          <input id="editScore" type="number" min="0" max="10" step="0.1" />
        </label>
        <label>技术评分
          <input id="editTechnical" type="number" min="0" max="10" step="0.1" />
        </label>
        <label>构图评分
          <input id="editComposition" type="number" min="0" max="10" step="0.1" />
        </label>
        <label>回忆评分
          <input id="editMemory" type="number" min="0" max="10" step="0.1" />
        </label>
        <label>独特评分
          <input id="editUniqueness" type="number" min="0" max="10" step="0.1" />
        </label>
        <label>拍摄地点
          <input id="editLocation" type="text" placeholder="例如：杭州，西湖断桥边" />
        </label>
        <label class="full-row">标签
          <input id="editTags" type="text" placeholder="用逗号分隔，例如：风景，旅行，黄昏" />
        </label>
        <label class="full-row">简评
          <textarea id="editReason" rows="3" placeholder="为这段回忆写一句温柔的话"></textarea>
        </label>
      </div>
      <div class="modal-actions">
        <button id="editCancelBtn" class="btn"><span class="btn-icon" data-icon="close"></span>取消</button>
        <button id="editSaveBtn" class="btn primary"><span class="btn-icon" data-icon="check"></span>保存回忆</button>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Loading modal -->
  <div id="loadingModal" class="modal hidden">
    <div class="modal-content loading-content">
      <div class="spinner"></div>
      <p id="loadingText">正在用大模型寻找相关回忆…</p>
    </div>
  </div>

  <!-- Custom confirm dialog -->
  <div id="confirmModal" class="modal hidden">
    <div class="modal-content confirm-content">
      <button class="modal-close" data-close="confirmModal"><span class="btn-icon" data-icon="close"></span></button>
      <h2 id="confirmTitle"><span class="modal-title-icon" data-icon="sparkles"></span>确认操作</h2>
      <p id="confirmMessage"></p>
      <div class="modal-actions">
        <button id="confirmCancelBtn" class="btn"><span class="btn-icon" data-icon="close"></span>取消</button>
        <button id="confirmOkBtn" class="btn primary danger"><span class="btn-icon" data-icon="check"></span>确定</button>
      </div>
    </div>
  </div>

  <!-- Fullscreen Zoom & Pan Modal -->
  <div id="fullscreenModal" class="fs-viewer hidden">
    <button id="fsCloseBtn" class="fs-viewer-close" title="退出全屏 (Esc)"><span class="btn-icon" data-icon="close"></span></button>
    <div class="fs-viewer-toolbar">
      <button id="fsZoomOutBtn" title="缩小 (滚轮下滚)"><span class="btn-icon" data-icon="zoomOut"></span></button>
      <span id="fsZoomPct" class="fs-zoom-pct">100%</span>
      <button id="fsZoomInBtn" title="放大 (滚轮上滚)"><span class="btn-icon" data-icon="zoomIn"></span></button>
      <button id="fsResetBtn" title="重置缩放"><span class="btn-icon" data-icon="reset"></span>还原</button>
    </div>
    <div id="fsImageContainer" class="fs-image-container">
      <img id="fsImage" alt="全屏照片" />
    </div>
  </div>

  <script src="/static/js/icons.js"></script>
  <script src="/static/js/ui-kit.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
